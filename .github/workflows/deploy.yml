# Builds the site and publishes the web root to the `deploy` branch.
# Hostinger pulls `deploy` into public_html, so the branch root IS the web root:
#   site/dist/*      -> /            (Immersive Solutions site)
#   public_html/*    -> /            (.htaccess, demo/ = Gaussian Splats viewer)
name: Build & publish deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble web root
        run: |
          mkdir out
          cp -a public_html/. out/
          cp -a site/dist/. out/
          test -f out/index.html && test -f out/.htaccess && test -d out/demo

      # Commit `out/` as the tree of `deploy` using this checkout's object store, so the push
      # only uploads what is new (the viewer and media blobs already exist in the repository).
      - name: Publish to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/deploy-index"
          (cd out && git --git-dir=../.git --work-tree=. add -A)
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Deploy ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/deploy"
