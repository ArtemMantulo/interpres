<!doctype html>
<html lang="en">
    <head>
        <title>Breig Standalone</title>
        <link rel="icon" href="/favicon.ico" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/web/asset.css" />
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <script src="playcanvas.min.js"></script>

        <div id="start-screen">
            <div class="start-image"></div>
            <div id="start-button" role="button" tabindex="0" aria-label="Start"></div>
        </div>

        <div id="amenities-container">
            <div
                class="amenities-empty"
                data-lng="amenities_empty"
                role="status"
                aria-live="polite"
            >
                No amenities available
            </div>
        </div>

        <div id="apartments-container"></div>

        <div class="mode-panel center hidden">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div
                class="icon-image button active"
                role="button"
                tabindex="0"
                data-mode="0"
                aria-label="Home"
                aria-pressed="true"
            ></div>
            <div class="panel-container">
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="1"
                    data-lng="apartments"
                ></div>
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="2"
                    data-lng="amenities"
                ></div>
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="Gallery"
                    data-lng="gallery"
                ></div>
            </div>
        </div>
        <div id="floor-panel" class="center hidden" aria-hidden="true">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <div class="floor-panel-label">Floor:</div>
                <div
                    id="floor-panel-scroll"
                    class="floor-panel-scroll"
                    role="listbox"
                    aria-label="Floors"
                ></div>
            </div>
        </div>

        <div id="amenities-info-panel">
            <button
                id="amenities-info-panel-prev"
                class="amenities-info-panel-nav amenities-info-panel-nav-prev"
                type="button"
                aria-label="Previous amenity"
            >
                <div class="glass-panel border-shadow"></div>
                <span class="amenities-info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
            <button
                id="amenities-info-panel-next"
                class="amenities-info-panel-nav amenities-info-panel-nav-next"
                type="button"
                aria-label="Next amenity"
            >
                <div class="glass-panel border-shadow"></div>
                <span class="amenities-info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <button
                    class="panel-close"
                    type="button"
                    aria-label="Close info panel"
                ></button>
                <div class="panel-title">Loading data...</div>
                <div class="panel-description">Loading data...</div>
                <div class="panel-line" aria-hidden="true"></div>
                <img
                    class="panel-image"
                    src="assets/images/pictures/pic_loading.png"
                    alt="Picture"
                />
            </div>
        </div>
        <div id="apartments-info-panel">
            <button
                id="apartments-info-panel-prev"
                class="apartments-info-panel-nav apartments-info-panel-nav-prev"
                type="button"
                aria-label="Previous apartment"
            >
                <div class="glass-panel border-shadow"></div>
                <span class="apartments-info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
            <button
                id="apartments-info-panel-next"
                class="apartments-info-panel-nav apartments-info-panel-nav-next"
                type="button"
                aria-label="Next apartment"
            >
                <div class="glass-panel border-shadow"></div>
                <span class="apartments-info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <button
                    class="panel-close apartment-panel-close"
                    type="button"
                    aria-label="Close apartments panel"
                ></button>
                <div id="apartments-panel-title" class="panel-title apartment-panel-title">
                    Loading data...
                </div>
                <div id="apartments-panel-data" class="apartment-panel-data">
                    <span
                        id="apartments-panel-area"
                        class="apartment-panel-value apartment-panel-area"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span class="apartment-bed-icon" aria-hidden="true"></span>
                    <span
                        id="apartments-panel-bedrooms"
                        class="apartment-panel-value apartment-panel-bedrooms"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span
                        id="apartments-panel-availability"
                        class="apartment-panel-value apartment-panel-availability"
                    ></span>
                </div>
                <div id="apartments-panel-description" class="panel-description apartment-panel-description">
                    Loading data...
                </div>
                <img
                    id="apartments-panel-image"
                    class="panel-image apartment-panel-image"
                    src="assets/images/pictures/pic_loading.png"
                    alt="Apartment"
                />
                <button
                    id="apartments-panel-plan"
                    class="apartment-panel-plan"
                    type="button"
                    data-lng="show_more_info"
                >
                    Show more info
                </button>
            </div>
        </div>
        <div id="apartments-info-panel-mobile" aria-hidden="true">
            <div id="apartments-info-panel-mobile-scroll" class="apartments-mobile-scroll"></div>
        </div>
        <div id="apartments-plan-panel" aria-hidden="true">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container apartments-expanded-panel-container">
                <button
                    id="apartments-expanded-close"
                    class="panel-close apartment-panel-close"
                    type="button"
                    aria-label="Close extended info panel"
                ></button>

                <div id="apartments-expanded-title" class="panel-title apartment-panel-title">
                    Loading data...
                </div>
                <div id="apartments-expanded-data" class="apartment-panel-data">
                    <span
                        id="apartments-expanded-area"
                        class="apartment-panel-value apartment-panel-area"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span class="apartment-bed-icon" aria-hidden="true"></span>
                    <span
                        id="apartments-expanded-bedrooms"
                        class="apartment-panel-value apartment-panel-bedrooms"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span
                        id="apartments-expanded-availability"
                        class="apartment-panel-value apartment-panel-availability"
                    ></span>
                </div>
                <div id="apartments-expanded-description" class="panel-description apartment-panel-description">
                    Loading data...
                </div>

                <div class="panel-line apartments-expanded-line"></div>

                <div class="apartments-expanded-tabs" role="tablist" aria-label="View type">
                    <button
                        id="apartments-expanded-tab-interior"
                        class="apartments-expanded-tab"
                        data-gallery-type="interior"
                        type="button"
                    >
                        <span class="apartments-expanded-tab-icon apartments-expanded-tab-icon-interior" aria-hidden="true"></span>
                        <span class="apartments-expanded-tab-text" data-lng="interior">Interior</span>
                    </button>
                    <button
                        id="apartments-expanded-tab-view"
                        class="apartments-expanded-tab"
                        data-gallery-type="view"
                        type="button"
                    >
                        <span class="apartments-expanded-tab-icon apartments-expanded-tab-icon-view" aria-hidden="true"></span>
                        <span class="apartments-expanded-tab-text" data-lng="view">View</span>
                    </button>
                    <button
                        id="apartments-expanded-tab-street"
                        class="apartments-expanded-tab is-active"
                        data-gallery-type="street"
                        type="button"
                    >
                        <span class="apartments-expanded-tab-icon apartments-expanded-tab-icon-street" aria-hidden="true"></span>
                        <span class="apartments-expanded-tab-text" data-lng="street">Street</span>
                    </button>
                </div>

                <div class="panel-line apartments-expanded-line"></div>

                <div class="apartments-expanded-gallery-head">
                    <div
                        id="apartments-expanded-gallery-label"
                        class="apartments-expanded-gallery-title"
                        data-lng="gallery_label"
                    >
                        Gallery
                    </div>
                    <button
                        id="apartments-expanded-view-all"
                        class="apartments-expanded-view-all"
                        type="button"
                        data-lng="view_all"
                    >
                        View All
                    </button>
                </div>

                <div class="apartments-expanded-gallery-main">
                    <img
                        id="apartments-expanded-main-image"
                        class="apartments-expanded-main-image"
                        src="assets/images/pictures/pic_loading.png"
                        alt="Apartment image"
                    />
                    <div id="apartments-expanded-mobile-slider" class="apartments-expanded-mobile-slider"></div>
                </div>

                <div id="apartments-expanded-thumbs" class="apartments-expanded-thumbs"></div>
            </div>
            <div class="apartments-expanded-nav">
                <button
                    id="apartments-expanded-prev"
                    class="apartment-panel-plan apartments-expanded-nav-btn"
                    type="button"
                >
                    <span class="apartments-expanded-nav-label" data-lng="previous">Previous</span>
                </button>
                <button
                    id="apartments-expanded-next"
                    class="apartment-panel-plan apartments-expanded-nav-btn"
                    type="button"
                >
                    <span class="apartments-expanded-nav-label" data-lng="next">Next</span>
                </button>
            </div>
        </div>
        <div class="gallery-panel hidden">
            <div class="gallery-dark">
                <div
                    class="gallery-close"
                    role="button"
                    tabindex="0"
                    aria-label="Close gallery"
                ></div>
            </div>
            <div class="gallery-content">
                <img class="gallery-main-image" alt="Gallery image" />
                <div class="gallery-empty" data-lng="gallery_empty" role="status" aria-live="polite">
                    No images available
                </div>
            </div>
            <div class="gallery-thumbnails"></div>
        </div>

        <div id="ui-toggles" class="hidden">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div id="ui-screenshot-toggle" class="ui-toggle">
                <button
                    id="ui-screenshot"
                    class="ui-placeholder-toggle-button ui-screenshot-toggle-button"
                    type="button"
                    aria-label="Screenshot"
                    aria-disabled="true"
                    disabled
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="screenshot">Screenshot</span>
                </div>
            </div>
            <div id="ui-season-toggle" class="ui-toggle">
                <button
                    id="ui-season"
                    class="ui-placeholder-toggle-button ui-season-toggle-button"
                    type="button"
                    aria-label="Season"
                    aria-disabled="true"
                    disabled
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="season">Season</span>
                </div>
            </div>
            <div id="ui-daytime-toggle" class="ui-toggle">
                <button
                    id="ui-daytime"
                    class="ui-placeholder-toggle-button ui-daytime-toggle-button"
                    type="button"
                    aria-label="Daytime"
                    aria-disabled="true"
                    disabled
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="daytime">Time of Day</span>
                </div>
            </div>
            <div id="ui-projection-toggle" class="ui-toggle">
                <button
                    id="ui-projection"
                    class="ui-placeholder-toggle-button ui-projection-toggle-button"
                    type="button"
                    aria-label="Projection"
                    aria-disabled="true"
                    disabled
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="projection">Projection</span>
                </div>
            </div>
            <div id="ui-visibility-toggle" class="ui-toggle">
                <button
                    id="hide-ui"
                    class="visibility-toggle-button is-on"
                    type="button"
                    aria-label="UI Visibility"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="hide_ui">Hide UI</span>
                </div>
            </div>
            <div id="fps-locker" class="ui-toggle">
                <button
                    id="fps30"
                    class="fpslock-toggle-button is-off"
                    type="button"
                    aria-label="FPS Lock"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="fps_lock">FPS Lock</span>
                </div>
            </div>
            <div id="quality-toggle" class="ui-toggle hidden">
                <button
                    id="quality"
                    class="quality-toggle-button is-off"
                    type="button"
                    aria-label="Quality"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="quality">Quality</span>
                </div>
            </div>
            <div id="sound-toggle" class="ui-toggle">
                <button
                    id="sound"
                    class="sound-toggle-button is-off"
                    type="button"
                    aria-label="Sound"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text" data-lng="sound">Sound</span>
                </div>
            </div>
        </div>

        <div id="debug-stats" class="hidden"></div>
        <div id="debug-stats-trigger" aria-hidden="true"></div>

        <script type="module" src="main.js"></script>

        <script>
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            let lastW = 0;
            let lastH = 0;

            function resizeCanvasForiOS() {
                if (!isiOS) return;
                const canvas = document.getElementById('application-canvas');
                if (!canvas) return;

                const w = window.innerWidth | 0;
                const h = window.innerHeight | 0;

                if (w === lastW && h === lastH) return;
                lastW = w;
                lastH = h;

                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }

            window.addEventListener('resize', resizeCanvasForiOS);
            window.addEventListener('orientationchange', resizeCanvasForiOS);
            resizeCanvasForiOS();
        </script>
    </body>
</html>
