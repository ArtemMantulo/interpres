<!doctype html>
<html lang="en">
    <head>
        <title>Breig Standalone</title>
        <link rel="icon" href="/favicon.ico" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/web/asset.css" />
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <script src="playcanvas.min.js"></script>

        <div id="start-screen">
            <div class="start-image"></div>
            <div id="start-button" role="button" tabindex="0" aria-label="Start"></div>
        </div>

        <div id="amenities-container">
            <div
                class="amenities-empty"
                data-lng="amenities_empty"
                role="status"
                aria-live="polite"
            >
                No amenities available
            </div>
        </div>

        <div id="apartments-container">
            <div class="apartments-empty" role="status" aria-live="polite">No apartments available</div>
        </div>

        <div class="mode-panel center hidden">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div
                class="icon-image button active"
                role="button"
                tabindex="0"
                data-mode="0"
                aria-label="Home"
                aria-pressed="true"
            ></div>
            <div class="panel-container">
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="1"
                >
                    Apartments
                </div>
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="2"
                    data-lng="amenities"
                ></div>
                <div
                    class="button"
                    role="button"
                    tabindex="0"
                    data-mode="Gallery"
                    data-lng="gallery"
                ></div>
            </div>
        </div>
        <div id="floor-panel" class="center hidden" aria-hidden="true">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <div class="floor-panel-label">Floor:</div>
                <div
                    id="floor-panel-scroll"
                    class="floor-panel-scroll"
                    role="listbox"
                    aria-label="Floors"
                ></div>
            </div>
        </div>

        <div id="info-panel">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <button
                    class="panel-close"
                    type="button"
                    aria-label="Close info panel"
                ></button>
                <div class="panel-title">Loading data...</div>
                <div class="panel-description">Loading data...</div>
                <div class="panel-line" aria-hidden="true"></div>
                <img
                    class="panel-image"
                    src="assets/images/pictures/pic_loading.png"
                    alt="Picture"
                />
            </div>
        </div>

        <div id="apartments-info-panel">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div class="panel-container">
                <button
                    class="panel-close apartment-panel-close"
                    type="button"
                    aria-label="Close apartments panel"
                ></button>
                <div id="apartments-panel-title" class="panel-title apartment-panel-title">
                    Loading data...
                </div>
                <div id="apartments-panel-data" class="apartment-panel-data">
                    <span
                        id="apartments-panel-area"
                        class="apartment-panel-value apartment-panel-area"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span class="apartment-bed-icon" aria-hidden="true"></span>
                    <span
                        id="apartments-panel-bedrooms"
                        class="apartment-panel-value apartment-panel-bedrooms"
                    ></span>
                    <span class="apartment-panel-separator" aria-hidden="true"></span>
                    <span
                        id="apartments-panel-availability"
                        class="apartment-panel-value apartment-panel-availability"
                    ></span>
                </div>
                <div id="apartments-panel-description" class="panel-description apartment-panel-description">
                    Loading data...
                </div>
                <img
                    id="apartments-panel-image"
                    class="panel-image apartment-panel-image"
                    src="assets/images/pictures/pic_loading.png"
                    alt="Apartment"
                />
                <button id="apartments-panel-visit" class="apartment-panel-visit" type="button">
                    Visit
                </button>
            </div>
        </div>
        <div id="info-panel-nav-wrap" aria-hidden="true">
            <button
                id="info-panel-prev"
                class="info-panel-nav info-panel-nav-prev"
                type="button"
                aria-label="Previous amenity"
            >
                <div class="glass-panel border-shadow">
                    <div class="amenities-line"></div>
                </div>
                <span class="info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
            <button
                id="info-panel-next"
                class="info-panel-nav info-panel-nav-next"
                type="button"
                aria-label="Next amenity"
            >
                <div class="glass-panel border-shadow">
                    <div class="amenities-line"></div>
                </div>
                <span class="info-panel-nav-arrow" aria-hidden="true"></span>
            </button>
        </div>

        <div class="gallery-panel hidden">
            <div class="gallery-dark">
                <div
                    class="gallery-close"
                    role="button"
                    tabindex="0"
                    aria-label="Close gallery"
                ></div>
            </div>
            <div class="gallery-content">
                <img class="gallery-main-image" alt="Gallery image" />
                <div class="gallery-empty" data-lng="gallery_empty" role="status" aria-live="polite">
                    No images available
                </div>
            </div>
            <div class="gallery-thumbnails"></div>
        </div>

        <div id="ui-toggles" class="hidden">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <div id="ui-visibility-toggle" class="ui-toggle">
                <button
                    id="hide-ui"
                    class="visibility-toggle-button is-on"
                    type="button"
                    aria-label="UI Visibility"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text">Hide UI</span>
                </div>
            </div>
            <div id="fps-locker" class="ui-toggle">
                <button
                    id="fps30"
                    class="fpslock-toggle-button is-off"
                    type="button"
                    aria-label="FPS Lock"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text">FPS Lock</span>
                </div>
            </div>
            <div id="quality-toggle" class="ui-toggle hidden">
                <button
                    id="quality"
                    class="quality-toggle-button is-off"
                    type="button"
                    aria-label="Quality"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text">Quality</span>
                </div>
            </div>
            <div id="sound-toggle" class="ui-toggle">
                <button
                    id="sound"
                    class="sound-toggle-button is-off"
                    type="button"
                    aria-label="Sound"
                    aria-pressed="false"
                ></button>
                <div class="ui-toggle-tooltip" aria-hidden="true">
                    <div class="glass-panel border-shadow">
                        <div class="amenities-line"></div>
                    </div>
                    <span class="ui-toggle-tooltip-text">Sound</span>
                </div>
            </div>
        </div>

        <div id="ui-restore-wrap" class="hidden">
            <div class="glass-panel border-shadow">
                <div class="amenities-line"></div>
            </div>
            <button
                id="ui-restore-toggle"
                class="visibility-toggle-button is-off"
                type="button"
                aria-label="Show UI"
                aria-pressed="false"
            ></button>
        </div>

        <div id="fullscreen-button" role="button" tabindex="0" aria-label="Fullscreen"></div>

        <div id="debug-stats" class="hidden"></div>

        <script type="module" src="main.js"></script>

        <script>
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            let lastW = 0;
            let lastH = 0;

            function resizeCanvasForiOS() {
                if (!isiOS) return;
                const canvas = document.getElementById('application-canvas');
                if (!canvas) return;

                const w = window.innerWidth | 0;
                const h = window.innerHeight | 0;

                if (w === lastW && h === lastH) return;
                lastW = w;
                lastH = h;

                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }

            window.addEventListener('resize', resizeCanvasForiOS);
            window.addEventListener('orientationchange', resizeCanvasForiOS);
            resizeCanvasForiOS();
        </script>
    </body>
</html>
