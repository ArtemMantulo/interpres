<style id="mobile-fixes">
/* Phone layout (iPhone 14 and up: 390–430 px wide). Pages use inline styles, so rules
   below target those inline declarations; desktop is untouched (max-width:600px only). */
@media (max-width:600px){
  html,body{overflow-x:clip}  /* clip, not hidden: keeps the sticky top bar working */
  .main{min-width:0}
  img,video,iframe{max-width:100%}
  .sec{padding:28px 18px!important}
  .sec[style*="height:"]{height:auto!important}
  h1{font-size:clamp(34px,10vw,44px)!important;line-height:1.05!important}
  h2{font-size:clamp(26px,7.4vw,32px)!important;line-height:1.12!important}
  h3{font-size:clamp(20px,5.8vw,24px)!important}
  p[style*="font:300 28px"],p[style*="font:300 24px"]{font-size:20px!important;line-height:1.45!important}
  p[style*="font:300 21px"],p[style*="font:300 19px"]{font-size:17px!important}
  [style*="white-space:nowrap"]:not(.subLine):not(#heroTitle):not(.pill):not(button){white-space:normal!important}
  [style*="max-width:90%"]{max-width:100%!important}
  p[style*="width:880px"],p[style*="width:720px"],p[style*="width:760px"]{width:auto!important}
  [style*="transform:translateX(-15%)"]{transform:none!important}

  /* multi-column inline grids -> one column */
  [style*="grid-template-columns:1fr 1fr"],[style*="grid-template-columns:repeat(3,1fr)"],
  [style*="grid-template-columns:1.4fr 1fr 1fr"],[style*="grid-template-columns:.95fr 1.05fr"],
  [style*="grid-template-columns:1.05fr .95fr"],[style*="grid-template-columns:1fr 340px"],
  [style*="grid-template-columns:1.3fr 1fr"],[style*="grid-template-columns:1.15fr .85fr"]{
    grid-template-columns:1fr!important;gap:20px!important}
  /* stat strips -> two columns */
  [style*="grid-template-columns:repeat(4,minmax(0,1fr))"],[style*="grid-template-columns:repeat(4,1fr)"],
  [style*="grid-template-columns:repeat(5,1fr)"]{grid-template-columns:1fr 1fr!important}
  /* film + two reels grid: film full width, reels side by side */
  [style*="grid-template-columns:2fr 1fr 1fr"]{grid-template-columns:1fr 1fr!important;height:auto!important}
  [style*="grid-template-columns:2fr 1fr 1fr"]>:first-child{grid-column:1/-1;aspect-ratio:16/10}
  [style*="grid-template-columns:2fr 1fr 1fr"]>:not(:first-child){aspect-ratio:9/16}

  /* fixed-width tiles in rails and rows never wider than the screen */
  [style*="flex:none;width:"]{max-width:84vw!important}
  [style*="flex:1 1 460px"],[style*="flex:1 1 360px"]{flex-basis:100%!important;min-width:0!important}
  [style*="min-width:320px"],[style*="min-width:300px"]{min-width:0!important}
  [style*="min-height:420px"],[style*="min-height:469px"]{min-height:0!important;aspect-ratio:16/10}
  [style*="flex:1 1 200px"]{flex:1 1 calc(50% - 8px)!important;min-width:0!important}  /* VR clips: two per row */
  [style*="width:236px"],[style*="width:264px"]{flex:1 1 calc(50% - 8px)!important;width:auto!important}
  #intRail{height:230px!important}  /* 16:9 walkthrough tiles at ~84vw */
  .cinewrap>button{display:none!important}  /* swipe instead of arrows */
  /* top bar: centred logo, sections in a burger menu */
  .topbar{position:sticky!important;top:0;flex-direction:row!important;justify-content:center!important;align-items:center!important;padding:14px 56px!important;min-height:56px;box-sizing:border-box}
  .topbar>div:first-child{padding:0;justify-content:center}
  .topbar .m{display:none!important}
  .topbar.open .m{display:flex!important;flex-direction:column;position:absolute;left:0;right:0;top:100%;gap:4px!important;padding:10px 14px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .topbar .m a{display:block;padding:13px 14px;border-radius:10px;font-size:17px;color:var(--ink);white-space:nowrap}
  .topbar .m a.on{background:rgba(134,184,160,.14);color:var(--acc)}
  .burger{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0}
  .burger span{display:block;width:22px;height:2px;border-radius:2px;background:var(--ink);transition:transform .25s ease,opacity .2s ease}
  .topbar.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .topbar.open .burger span:nth-child(2){opacity:0}
  .topbar.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  /* digital twin hero */
  .hero-lt .sub{font-size:17px!important;line-height:1.5!important;color:var(--mut)!important}
  .hero-lt .sub br{display:none}
  .hstats .v{font-size:20px!important}
  .hstats .st{padding:0 10px!important}
  /* home: hero */
  /* home hero (phone): video pinned to the top (30% side crop), text centred below it on a green panel */
  .hero{height:auto!important;min-height:0!important;overflow:hidden;background:#0d100c}
  #heroVideo{position:relative;display:block;margin-left:-21.43vw;width:142.86vw!important;height:auto!important;max-width:none!important;aspect-ratio:971/540;object-fit:cover!important}
  .hero>[style*="pointer-events:none;background:linear-gradient(180deg,rgba(20,18,14,.42)"]{display:none}
  [style*="position:absolute;left:52px;bottom:31px"]{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;max-width:none!important;
    text-align:center;padding:26px 20px 28px;background:linear-gradient(158deg,#27302c 0%,#202824 48%,#1b221e 100%);border-top:1px solid var(--line);box-shadow:inset 0 0 0 9999px rgba(134,184,160,.05)}
  [style*="position:absolute;left:52px;bottom:31px"] #heroTitle{display:inline-block}
  [style*="position:absolute;left:52px;bottom:31px"] #heroSub{margin-left:auto!important;margin-right:auto!important}
  .heroBtns{justify-content:center}
  /* partners: label on top, names in one swipeable row */
  .trust{display:grid!important;grid-auto-flow:column;grid-auto-columns:max-content;grid-template-rows:auto auto;gap:8px 26px!important;padding:14px 18px!important;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .trust::-webkit-scrollbar{display:none}
  .trust>span{grid-row:1;grid-column:1/span 6}
  .trust>b{grid-row:2;font-size:15px}
  .heroMore{display:block!important;margin:-4px auto 20px;max-width:340px;font:300 14px/1.55 Inter;color:var(--mut)}
  /* first phone screen = hero + "Trusted by" strip; the products block starts below the fold */
  .heroFill{display:flex;flex-direction:column}
  .heroFill>[style*="position:absolute;left:52px;bottom:31px"]{flex:1;display:flex;flex-direction:column;justify-content:center}
  #heroSound{top:14px!important;right:14px!important;bottom:auto!important;width:42px!important;height:42px!important}
  /* home: products — menu becomes a swipeable row above full-screen slides */
  .prodrow{grid-template-columns:minmax(0,1fr)!important}
  .prodrow>*{min-width:0}
  .prod-scroll{height:calc(100svh - 92px - 56px)!important;min-height:480px!important}
  .prodrow>div:first-child{width:auto!important;padding:18px 18px 12px!important}
  .prodrow>div:first-child>div:first-child{margin-bottom:10px!important}
  .prodnav{flex-direction:row!important;overflow-x:auto;scrollbar-width:none;gap:6px!important}
  .prodnav::-webkit-scrollbar{display:none}
  /* swipeable rows hint that there is more: fade on the side that still has content */
  .swipe-more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 90px),transparent)}
  .swipe-more.swipe-mid{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 90px),transparent)}
  .swipe-more.swipe-end{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
  .pn{width:auto!important;white-space:nowrap;padding:9px 12px!important;font-size:14px!important;border-left:0!important;border-bottom:2px solid transparent!important;border-radius:8px}
  .pn.on{border-bottom-color:var(--acc)!important}
  /* laptop slide: lift the laptop above the slide text (image is shifted up, slide bg shows below) */
  .prod-scroll img[src*="033-dt-laptop"]{transform:translateY(-24%);height:124%!important}
  .prod-scroll [style*="left:44px;bottom:44px"]{left:18px!important;right:18px!important;bottom:22px!important;max-width:none!important}
  .prod-scroll [style*="display:inline-flex;gap:30px"]{gap:14px 20px!important;padding:12px 14px!important}
  .casecard .cap .t{font-size:24px!important}
  .pill{padding:12px 20px}
}
</style>
<!--mobile:css-end-->

<script id="mobile-video">
/* Mobile top bar: burger button that opens the section menu. */
(function(){
  var bar=document.querySelector('.topbar'), menu=bar&&bar.querySelector('.m');
  if(!bar||!menu||bar.querySelector('.burger')) return;
  menu.id=menu.id||'mobileMenu';
  var btn=document.createElement('button');
  btn.type='button'; btn.className='burger'; btn.setAttribute('aria-label','Menu'); btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-controls',menu.id);
  btn.innerHTML='<span></span><span></span><span></span>';
  bar.appendChild(btn);
  function set(open){bar.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-label',open?'Close menu':'Menu');}
  btn.addEventListener('click',function(e){e.stopPropagation();set(!bar.classList.contains('open'));});
  menu.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
  document.addEventListener('click',function(e){if(bar.classList.contains('open')&&!bar.contains(e.target))set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
})();
/* Home on phones: stretch the hero panel so hero + trust strip fill exactly one screen. */
(function(){
  var v=document.getElementById('heroVideo'); if(!v||!matchMedia('(max-width:600px)').matches) return;
  var hero=v.parentElement, trust=document.querySelector('.trust'), bar=document.querySelector('.topbar');
  hero.classList.add('heroFill'); /* style attr gets rewritten by JS, so CSS targets .hero */
  function fit(){ if(!matchMedia('(max-width:600px)').matches){hero.style.minHeight='';return;}
    var h=innerHeight-(bar?bar.getBoundingClientRect().height:0)-(trust?trust.getBoundingClientRect().height:0)-4; hero.style.setProperty('min-height',Math.max(h,0)+'px','important'); }
  fit(); addEventListener('resize',fit); addEventListener('orientationchange',fit);
})();
/* Swipeable rows (product tabs, partners): fade the edge that still has hidden content. */
(function(){
  [].forEach.call(document.querySelectorAll('.prodnav, .trust'),function(el){
    function upd(){
      var max=el.scrollWidth-el.clientWidth;
      if(max<=2||!matchMedia('(max-width:600px)').matches){el.classList.remove('swipe-more','swipe-mid','swipe-end');return;}
      el.classList.add('swipe-more');
      el.classList.toggle('swipe-end',el.scrollLeft>=max-2);
      el.classList.toggle('swipe-mid',el.scrollLeft>2&&el.scrollLeft<max-2);
    }
    el.addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd); upd();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(upd);
    // one gentle nudge the first time the row comes into view, so it reads as swipeable
    if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){if(!es[0].isIntersecting)return;io.disconnect();
      if(el.scrollWidth-el.clientWidth<=2||el.scrollLeft>0)return;
      setTimeout(function(){el.scrollTo({left:48,behavior:'smooth'});setTimeout(function(){el.scrollTo({left:0,behavior:'smooth'});},450);},400);},{threshold:.9});io.observe(el);}
  });
})();
/* Touch screens have no hover: play muted tile videos while they are on screen. */
(function(){
  if(!window.matchMedia||!matchMedia('(hover: none)').matches||!('IntersectionObserver' in window)) return;
  var vids=[].slice.call(document.querySelectorAll('video')).filter(function(v){return v.id!=='heroVideo'&&(v.muted||v.hasAttribute('muted'));});
  if(!vids.length) return;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;
    if(e.isIntersecting){v.preload='auto';v.style.opacity=1;var p=v.play();if(p&&p.catch)p.catch(function(){});}
    else v.pause();});},{threshold:.5});
  vids.forEach(function(v){io.observe(v);});
})();
</script>
<!--mobile:js-end-->
